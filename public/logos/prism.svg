<svg width="260" height="260" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Green gradients -->
    <linearGradient id="beam1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006239"/>
      <stop offset="100%" stop-color="#00A86B"/>
    </linearGradient>

    <linearGradient id="beam2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D68F"/>
      <stop offset="100%" stop-color="#00A86B"/>
    </linearGradient>

    <linearGradient id="beam3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#8FF6C4"/>
      <stop offset="100%" stop-color="#39C87E"/>
    </linearGradient>
  </defs>

  <!-- Outer triangle outline -->
  <polygon
    points="130,20 240,230 20,230"
    fill="none"
    stroke="#006239"
    stroke-width="20"
    stroke-linejoin="round"
  />

  <!-- Inner light beam layers -->
  <polygon points="130,60 180,150 130,200" fill="url(#beam1)" opacity="0.95"/>
  <polygon points="130,60 80,150 130,200" fill="url(#beam2)" opacity="0.9"/>
  
  <!-- Central bright prism -->
  <polygon points="130,90 165,150 95,150" fill="url(#beam3)" />

</svg>
