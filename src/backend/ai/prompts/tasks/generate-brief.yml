name: taskGenerateBrief
version: 1
template: |
  Generate a clear and complete Project Brief for "{{name}}".
  Follow this structure strictly and only produce Markdown content:
  - Problem
  - Target Users
  - Goals
  - Constraints
  - Scope (MVP)
  - Success Metrics

  Inputs:
  Problem: {{problem}}
  Target Users: {{targetUser}}
  Goals: {{goals}}
  Constraints: {{constraints}}


