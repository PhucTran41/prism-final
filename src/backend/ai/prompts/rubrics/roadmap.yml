name: rubric-roadmap
version: 2
template: |
  Checklist:
  - JSON only; schema matches exactly (items[], and optionally epics[]/stories[]).
  - Dates use ISO format YYYY-MM-DD.
  - Cadence respected (weekly/monthly/quarterly) and "max items per period" not exceeded.
  - Horizon and start date respected; items fall within window.
  - Holidays avoided by shifting to next work day.
  - Story windows are within their parent epic windows.
  - Priorities use M/S/C consistently.
  - If include story-level schedule is "no", omit stories[] entirely.
  - Items are concise: 1-line title + 1-line description.
